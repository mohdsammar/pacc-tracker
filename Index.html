lor:var(--navy);font-size:18px;margin-bottom:10px}.empty button{margin-top:18px}.note{font-size:11px;color:var(--muted);margin-top:14px}.two{display:grid;grid-template-columns:1fr 1fr;gap:20px}input,select,textarea{border:1px solid #cdd4df;border-radius:4px;padding:10px;background:white;color:var(--ink);min-width:0;max-width:100%}input:focus,select:focus,textarea:focus{outline:2px solid #f6b51a60;border-color:var(--gold)}dialog{border:0;border-radius:9px;padding:0;width:850px;max-width:95vw;max-height:92vh;box-shadow:0 20px 80px #0005}dialog::backdrop{background:#10182bc0}.modalhead{padding:20px 25px;background:var(--navy);color:white;display:flex;align-items:center;justify-content:space-between;border-bottom:3px solid var(--gold)}.modalhead button{background:transparent;color:white;border:0;font-size:20px;padding:0 5px}.modalbody{padding:2px 25px 24px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.field{display:flex;flex-direction:column;gap:7px;font-size:12px;font-weight:bold}.full{grid-column:1/-1}.checks{display:flex;gap:10px;flex-wrap:wrap}.check{display:flex;gap:7px;align-items:center;font-size:12px;font-weight:normal;border:1px solid var(--line);border-radius:4px;padding:10px}.check:has(input:checked){background:var(--soft);border-color:var(--gold)}.check input{accent-color:var(--navy)}.totals{display:flex;margin:20px 0;gap:2px}.totals div{flex:1;background:#f0f2f5;padding:16px;text-align:center}.totals div:last-child{background:var(--navy);color:white}.totals span{display:block;color:var(--muted);font-size:10px;font-weight:bold;text-transform:uppercase;margin-bottom:7px}.totals div:last-child span{color:#b8c3d8}.totals strong{font-size:20px}.modalfoot{display:flex;justify-content:flex-end;gap:8px;padding-top:15px;border-top:1px solid var(--line)}#toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:var(--navy);color:white;padding:14px 22px;border-bottom:3px solid var(--gold);border-radius:5px;z-index:100;display:none}#e .minitable td,.minitable th{padding:9px 10px}
.done{opacity:.55;text-decoration:line-through}
.linkbtn{border:0;background:none;padding:0;color:var(--navy);font-weight:bold;text-decoration:underline;text-decoration-color:var(--gold);text-underline-offset:3px}

.sectionrow{display:flex;justify-content:space-between;align-items:center;margin-top:22px}.sectionrow h3{margin:0}

.settings .panel .bodypad{padding:18px 22px}

.marginpos{color:#17663a}.marginneg{color:#a12d2d}
[dir=rtl] .modalhead button{margin:0}
[dir=rtl] body{font-family:Tahoma,Arial,sans-serif}

'use strict';
/* ================= Constants ================= */
const TYPES=['Shade Systems','Interior Fit-Out','Steel Structures & Hangars','Security & CCTV'];
const RFQ_ST=['New RQ','In progress','Submitted','Awarded','Lost','Cancelled'];
const OUTCOMES=['Awarded','Lost','Cancelled'];
const Q_ST=['In progress','Submitted'];
const ROLES=[{id:'pm',name:'Project manager'},{id:'prep',name:'Prepared by'}];
const VAT_RATE=15;
const CFG_KEY='pacc-qt2-config',CACHE_KEY='pacc-qt2-data',LANG_KEY='pacc-qt2-lang',V1_KEY='pacc-quotation-tracker-v1';
const XLSX_URL='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';

/* ================= Helpers ================= */
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>globalThis.crypto?.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2);
const today=()=>new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Riyadh'});
const addDays=(d,n)=>{const x=new Date(d+'T12:00:00Z');x.setUTCDate(x.getUTCDate()+n);return x.toISOString().slice(0,10)};
const money=n=>Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const r2=n=>Math.round(Number(n||0)*100)/100;
const calc=n=>{const net=r2(n);const vat=r2(net*VAT_RATE/100);return {net,vat,total:r2(net+vat)}};
const marginPct=(net,cost)=>net>0&&cost>0?Math.round((net-cost)/net*1000)/10:null;
const clone=o=>JSON.parse(JSON.stringify(o));
const lc=s=>String(s||'').trim().toLowerCase();
const byId=(arr,id)=>arr.find(x=>x.id===id);
const nowIso=()=>new Date().toISOString();
const fmtTime=iso=>{if(!iso)return '';const d=new Date(iso);return d.toLocaleString('en-GB',{timeZone:'Asia/Riyadh',day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})};
function lsGet(k){try{return localStorage.getItem(k)}catch{return null}}
function lsSet(k,v){try{localStorage.setItem(k,v);return true}catch{return false}}
function lsDel(k){try{localStorage.removeItem(k)}catch{}}

/* ================= i18n ================= */
let lang=lsGet(LANG_KEY)==='ar'?'ar':'en';
const t=(s,vars)=>{let o=lang==='ar'?(AR[s]??s):s;if(vars)for(const [k,v] of Object.entries(vars))o=o.split('{'+k+'}').join(v);return o};

/* ================= Data model ================= */
function emptyDb(){return {schema:2,settings:{quoteStart:1,quoteYear:today().slice(0,4)},team:[],clients:[],suppliers:[],rfqs:[],quotes:[],supplierQuotes:[],followups:[],log:[]}}
function normalize(d){
  const e=emptyDb();for(const k of Object.keys(e))if(d[k]===undefined)d[k]=e[k];
  d.settings={...e.settings,...d.settings};
  for(const p of d.team){p.roles=Array.isArray(p.roles)?p.roles:[];if(p.active===undefined)p.active=true}
  for(const c of d.clients){c.sites=c.sites||[];c.contacts=c.contacts||[];if(c.active===undefined)c.active=true}
  for(const s of d.suppliers){s.types=s.types||[];if(s.active===undefined)s.active=true}
  for(const r of d.rfqs){r.types=r.types||[];r.supplierIds=r.supplierIds||[]}
  for(const q of d.quotes){q.rev=Number(q.rev)||0;q.net=Number(q.net)||0;q.cost=Number(q.cost)||0}
  return d;
}
/* Migrate a backup from the first tracker (v1) into the v2 model */
function migrateV1(o){
  const n=emptyDb();
  n.team=(o.team||[]).map(p=>({id:p.id,name:p.name||'',email:p.email||'',phone:p.phone||'',active:true,roles:(p.roles||[]).map(r=>r==='Project manager'?'pm':r==='Prepared by'?'prep':r).filter(r=>r==='pm'||r==='prep')}));
  for(const p of n.team)if(!p.roles.length)p.roles=['prep'];
  n.clients=(o.clients||[]).map(c=>({id:c.id,name:c.name||'',vatNo:'',crNo:'',phone:c.phone||'',email:c.email||'',notes:c.notes||'',active:true,
    sites:(c.sites||[]).map(s=>({id:s.id,name:s.name||'',city:'',address:s.address||''})),
    contacts:(c.contacts||[]).map(x=>({id:x.id,name:x.name||'',title:x.title||'',phone:x.phone||'',email:x.email||'',siteId:x.siteId||''}))}));
  n.suppliers=(o.suppliers||[]).map(s=>({id:s.id,name:s.name||'',types:s.types||[],contact:s.contact||'',phone:s.phone||'',email:s.email||'',vatNo:'',notes:s.notes||'',active:true}));
  for(const r of (o.rfqs||[])){
    let c=byId(n.clients,r.clientId)||n.clients.find(x=>lc(x.name)===lc(r.client));
    if(!c){c={id:uid(),name:(r.client||'Unknown client').trim(),vatNo:'',crNo:'',phone:'',email:'',notes:'',active:true,sites:[],contacts:[]};n.clients.push(c)}
    let contactId=c.contacts.some(x=>x.id===r.contactId)?r.contactId:'';
    if(!contactId&&r.attention?.trim()){let x=c.contacts.find(k=>lc(k.name)===lc(r.attention));if(!x){x={id:uid(),name:r.attention.trim(),title:'',phone:'',email:'',siteId:''};c.contacts.push(x)}contactId=x.id}
    const siteId=c.sites.some(x=>x.id===r.siteId)?r.siteId:'';
    n.rfqs.push({id:r.id,no:r.no,date:r.date,dueDate:'',clientId:c.id,siteId,contactId,project:r.project||'',location:r.location||'',owner:r.owner||'',subject:r.subject||'',types:r.types||[],manager:r.manager||'',prepared:r.prepared||'',supplierIds:(r.suppliers||[]).filter(id=>byId(n.suppliers,id)),status:RFQ_ST.includes(r.status)?r.status:'New RQ',reason:'',notes:r.notes||''});
  }
  for(const q of (o.quotes||[])){if(!byId(n.rfqs,q.rfqId))continue;
    n.quotes.push({id:q.id,rfqId:q.rfqId,quoteNo:q.quoteNo,rev:0,date:q.date,validUntil:'',prepared:q.prepared||byId(n.rfqs,q.rfqId).prepared||'',status:q.status==='Submitted'?'Submitted':'In progress',net:Number(q.net)||0,cost:0,folderPath:q.folderPath||'',notes:q.notes||'',snapshot:null});
    const r=byId(n.rfqs,q.rfqId);if(q.manager&&!r.manager)r.manager=q.manager;
  }
  for(const p of n.team){if(n.rfqs.some(r=>r.manager===p.id)&&!p.roles.includes('pm'))p.roles.push('pm');if([...n.rfqs,...n.quotes].some(r=>r.prepared===p.id)&&!p.roles.includes('prep'))p.roles.push('prep')}
  for(const q of n.quotes)if(q.status==='Submitted')q.snapshot=makeSnapshot(n,q);
  for(const r of n.rfqs){if(['Submitted','Awarded','Lost'].includes(r.status)&&!currentQuotes(n,r.id).some(q=>q.status==='Submitted'))r.status=quotesOf(n,r.id).length?'In progress':'New RQ';syncRfq(n,r.id)}
  const stamp=nowIso();for(const k of ['team','clients','suppliers','rfqs','quotes'])for(const x of n[k]){x.updatedAt=stamp;x.updatedBy='Import'}
  n.log.unshift({t:stamp,by:userName(),a:'Imported records from the first tracker backup'});
  return n;
}

/* ================= Derived data ================= */
const quotesOf=(d,rfqId)=>d.quotes.filter(q=>q.rfqId===rfqId);
const isCurrent=(d,q)=>!d.quotes.some(x=>x.rfqId===q.rfqId&&x.quoteNo===q.quoteNo&&x.rev>q.rev);
const currentQuotes=(d,rfqId)=>d.quotes.filter(q=>(!rfqId||q.rfqId===rfqId)&&isCurrent(d,q));
const clientOf=(d,r)=>byId(d.clients,r?.clientId);
const siteOf=(d,r)=>clientOf(d,r)?.sites.find(s=>s.id===r.siteId);
const contactOf=(d,r)=>clientOf(d,r)?.contacts.find(c=>c.id===r.contactId);
const personName=(d,id)=>byId(d.team,id)?.name||'';
/* RFQ status is driven by its current quotations unless an outcome has been set */
function syncRfq(d,rfqId){const r=byId(d.rfqs,rfqId);if(!r||OUTCOMES.includes(r.status))return;const cur=currentQuotes(d,rfqId);
  if(cur.some(q=>q.status==='Submitted'))r.status='Submitted';else if(cur.length)r.status='In progress';else if(r.status==='Submitted')r.status='In progress'}
function allowedRfqStatuses(d,r){const cur=r?currentQuotes(d,r.id):[];if(cur.some(q=>q.status==='Submitted'))return ['Submitted','Awarded','Lost','Cancelled'];if(cur.length)return ['In progress','Cancelled'];return ['New RQ','In progress','Cancelled']}
function qStatus(d,q){if(!isCurrent(d,q))return 'Superseded';const r=byId(d.rfqs,q.rfqId);if(r?.status==='Cancelled')return 'Cancelled';if(q.status==='Submitted'&&r&&OUTCOMES.includes(r.status))return r.status;return q.status}
function makeSnapshot(d,q){const r=byId(d.rfqs,q.rfqId)||{};return {client:clientOf(d,r)?.name||'',site:siteOf(d,r)?.name||'',attention:contactOf(d,r)?.name||'',project:r.project||'',location:r.location||'',owner:r.owner||'',subject:r.subject||'',types:[...(r.types||[])],rfqNo:r.no||'',at:nowIso()}}
function liveInfo(d,q){const r=byId(d.rfqs,q.rfqId)||{};return {client:clientOf(d,r)?.name||'',site:siteOf(d,r)?.name||'',attention:contactOf(d,r)?.name||'',project:r.project||'',location:r.location||'',owner:r.owner||'',subject:r.subject||'',types:r.types||[],rfqNo:r.no||''}}
const infoOf=(d,q)=>q.status==='Submitted'&&q.snapshot?{...liveInfo(d,q),...q.snapshot,rfqNo:byId(d.rfqs,q.rfqId)?.no||q.snapshot.rfqNo}:liveInfo(d,q);
function nextQuoteNo(d,date){const y=(date||today()).slice(0,4);let max=0;for(const q of d.quotes){const m=/^(\d+)\/(\d{4})$/.exec(String(q.quoteNo).trim());if(m&&m[2]===y)max=Math.max(max,Number(m[1]))}
  const start=d.settings.quoteYear===y?Number(d.settings.quoteStart)||1:1;return `${Math.max(max+1,start)}/${y}`}
function supplierCost(d,rfqId){return r2(d.supplierQuotes.filter(s=>s.rfqId===rfqId).reduce((a,s)=>a+Number(s.amount||0),0))}
function alertsOf(d){const td=today(),out=[];
  for(const r of d.rfqs)if(['New RQ','In progress'].includes(r.status)&&r.dueDate){if(r.dueDate<td)out.push({red:1,txt:t('Overdue: RFQ {no} was due {d}',{no:r.no,d:r.dueDate}),rfq:r.id});else if(r.dueDate<=addDays(td,3))out.push({txt:t('Due soon: RFQ {no} due {d}',{no:r.no,d:r.dueDate}),rfq:r.id})}
  for(const q of currentQuotes(d)){const r=byId(d.rfqs,q.rfqId);if(q.status!=='Submitted'||r?.status!=='Submitted'||!q.validUntil)continue;
    if(q.validUntil<td)out.push({red:1,txt:t('Validity expired: {no} (Rev {rev}) on {d}',{no:q.quoteNo,rev:q.rev,d:q.validUntil}),rfq:r.id});else if(q.validUntil<=addDays(td,7))out.push({txt:t('Validity ends soon: {no} (Rev {rev}) on {d}',{no:q.quoteNo,rev:q.rev,d:q.validUntil}),rfq:r.id})}
  for(const f of d.followups){const r=byId(d.rfqs,f.rfqId);if(!f.done&&f.nextDate&&f.nextDate<=td&&r&&!['Lost','Cancelled'].includes(r.status))out.push({red:f.nextDate<td?1:0,txt:t('Follow-up due {d}: RFQ {no} — {a}',{d:f.nextDate,no:r.no,a:f.nextAction||f.note}),rfq:r.id})}
  return out.sort((a,b)=>(b.red||0)-(a.red||0))}

/* ================= Validation (runs before every save) ================= */
function fail(msg){throw new Error(msg)}
function validateAll(d){
  const isDate=s=>/^\d{4}-\d{2}-\d{2}$/.test(s)&&Number.isFinite(Date.parse(s));
  const ids=new Set;for(const k of ['team','clients','suppliers','rfqs','quotes','supplierQuotes','followups'])for(const x of d[k]){if(!x?.id||ids.has(x.id))fail(t('Invalid or duplicate record identifier.'));ids.add(x.id)}
  for(const p of d.team){if(!p.name?.trim())fail(t('Team member name is required.'));if(!p.roles.length||p.roles.some(r=>!['pm','prep'].includes(r)))fail(t('Select at least one responsibility for {n}.',{n:p.name}))}
  const cn=new Set;for(const c of d.clients){if(!c.name?.trim())fail(t('Client name is required.'));if(cn.has(lc(c.name)))fail(t('Client "{n}" already exists.',{n:c.name}));cn.add(lc(c.name));
    for(const s of c.sites)if(!s.name?.trim())fail(t('Each site needs a name.'));

    if(r.contactId&&!c.contacts.some(s=>s.id===r.contactId))fail(t('A removed site or contact is used by RFQ {n}. Reassign that RFQ first.',{n:r.no}));

    if(!r.types.length||r.types.some(x=>!TYPES.includes(x)))fail(t('Select at least one work type.'));

  const qk=new Set,qOwner={};for(const q of d.quotes){
    if(!byId(d.rfqs,q.rfqId))fail(t('Quotation must be linked to an RFQ.'));
    if(!q.quoteNo?.trim())fail(t('Quotation No. is required.'));const key=lc(q.quoteNo)+'#'+q.rev;if(qk.has(key))fail(t('Quotation {n} Rev {r} already exists.',{n:q.quoteNo,r:q.rev}));qk.add(key);
    if(qOwner[lc(q.quoteNo)]&&qOwner[lc(q.quoteNo)]!==q.rfqId)fail(t('Quotation No. "{n}" is already used on another RFQ.',{n:q.quoteNo}));qOwner[lc(q.quoteNo)]=q.rfqId;
    if(!isDate(q.date))fail(t('Enter a valid quotation date.'));if(q.validUntil&&!isDate(q.validUntil))fail(t('Enter a valid validity date.'));
    if(!Number.isFinite(q.net)||q.net<0||q.net>1e12)fail(t('Enter a valid net subtotal.'));if(!Number.isFinite(q.cost)||q.cost<0)fail(t('Enter a valid cost.'));

  for(const s of d.supplierQuotes){if(!byId(d.rfqs,s.rfqId)||!byId(d.suppliers,s.supplierId))fail(t('Supplier quote needs a valid RFQ and supplier.'));if(!Number.isFinite(Number(s.amount))||Number(s.amount)<0)fail(t('Enter a valid amount.'))}
  for(const f of d.followups){if(!byId(d.rfqs,f.rfqId))fail(t('Follow-up must be linked to an RFQ.'));if(!f.note?.trim())fail(t('Follow-up note is required.'));if(!isDate(f.date))fail(t('Enter a valid date.'))}
}

/* ================= Storage: GitHub (shared) or this browser (local) ================= */
let cfg=(()=>{try{return JSON.parse(lsGet(CFG_KEY)||'{}')}catch{return {}}})();
cfg={owner:'',repo:'',branch:'main',path:'data.json',token:'',user:'',...cfg};
const userName=()=>cfg.user?.trim()||'User';
const ghMode=()=>!!(cfg.owner&&cfg.repo&&cfg.token);
let db=emptyDb(),sha=null,sync={state:'idle',at:null,msg:''},readOnly=false,remoteMissing=false;
class ConflictError extends Error{constructor(rec){super('conflict');this.rec=rec}}
const b64enc=str=>{const bytes=new TextEncoder().encode(str);let bin='';for(let i=0;i<bytes.length;i+=0x8000)bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000));return btoa(bin)};
const b64dec=b64=>new TextDecoder().decode(Uint8Array.from(atob(b64.replace(/\s/g,'')),c=>c.charCodeAt(0)));
function ghUrl(){return `https://api.github.com/repos/${encodeURIComponent(cfg.owner.trim())}/${encodeURIComponent(cfg.repo.trim())}/contents/${cfg.path.trim().split('/').map(encodeURIComponent).join('/')}`}
async function ghFetch(method,body,accept){
  const url=ghUrl()+(method==='GET'?`?ref=${encodeURIComponent(cfg.branch.trim()||'main')}`:'');
  let res;try{res=await fetch(url,{method,cache:'no-store',headers:{Authorization:'Bearer '+cfg.token.trim(),Accept:accept||'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28',...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined})}
  catch(e){const er=new Error(t('Cannot reach GitHub. Check your internet connection.'));er.net=true;throw er}
  return res}
async function ghErr(res){let m='';try{m=(await res.json()).message||''}catch{}
  if(res.status===401)return new Error(t('GitHub rejected the token (401). Check or renew your token.'));
  if(res.status===403)return new Error(t('GitHub refused access (403): {m}',{m}));
  if(res.status===404)return new Error(t('Repository or branch not found (404). Check owner, repo, branch and token access.'));
  return new Error('GitHub '+res.status+': '+m)}
async function ghLoad(){
  const res=await ghFetch('GET');
  if(res.status===404){/* distinguish missing file from missing repo */const rr=await fetch(`https://api.github.com/repos/${encodeURIComponent(cfg.owner.trim())}/${encodeURIComponent(cfg.repo.trim())}`,{headers:{Authorization:'Bearer '+cfg.token.trim(),Accept:'application/vnd.github+json'}}).catch(()=>null);
    if(rr&&rr.ok)return {missing:true};throw await ghErr(res)}
  if(!res.ok)throw await ghErr(res);
  const j=await res.json();let text;
  if(j.encoding==='base64'&&j.content)text=b64dec(j.content);
  else{const raw=await ghFetch('GET',null,'application/vnd.github.raw+json');if(!raw.ok)throw await ghErr(raw);text=await raw.text()}
  let data;try{data=JSON.parse(text||'{}')}catch{throw new Error(t('data.json on GitHub is not valid JSON.'))}
  return {data:prepareLoaded(data),sha:j.sha}}
async function ghSave(data,message){
  const body={message,content:b64enc(JSON.stringify(data,null,1)),branch:cfg.branch.trim()||'main'};if(sha)body.sha=sha;
  const res=await ghFetch('PUT',body);
  if(res.status===409||res.status===422)throw Object.assign(new Error('stale'),{stale:true});
  if(!res.ok)throw await ghErr(res);
  const j=await res.json();sha=j.content?.sha||null}
function prepareLoaded(data){if(!data||typeof data!=='object')throw new Error(t('Invalid data file.'));const d=data.schema===2?normalize(data):(data.rfqs?migrateV1(data):normalize(emptyDb()));validateAll(d);return d}
function cache(){lsSet(CACHE_KEY,JSON.stringify({db,sha,at:sync.at,src:ghMode()?cfg.owner+'/'+cfg.repo:'local'}))}

/* Load at start / refresh */
async function loadData(silent){
  if(!ghMode()){readOnly=false;remoteMissing=false;try{const c=JSON.parse(lsGet(CACHE_KEY)||'null');if(c?.db&&c.src==='local'){db=prepareLoaded(c.db)}else if(!c){const v1=lsGet(V1_KEY);if(v1){db=migrateV1(JSON.parse(v1));cache()}}}catch(e){showBanner('err',t('Saved records could not be loaded: {m}',{m:e.message}))}setSync('local');render();return}
  setSync('busy',t('Loading…'));
  try{const r=await ghLoad();
    if(r.missing){remoteMissing=true;readOnly=true;setSync('err',t('data.json not found'));if(page!=='settings')page='settings';render();return}
    const changed=r.sha!==sha;remoteMissing=false;readOnly=false;db=r.data;sha=r.sha;sync.at=nowIso();cache();setSync('ok');if(changed||!silent)render();if(silent&&changed)toast(t('Updated with the latest changes from GitHub.'))}
  catch(e){readOnly=true;try{const c=JSON.parse(lsGet(CACHE_KEY)||'null');if(c?.db&&c.src===cfg.owner+'/'+cfg.repo){db=normalize(c.db);sha=c.sha}}catch{}
    setSync('err',e.message);render();if(!silent)toast(e.message)}}

/* Every change goes through commit(): apply → validate → save → (on GitHub conflict) reload latest and re-apply */
let chain=Promise.resolve();
function commit(label,fn){
  const p=chain.then(async()=>{
    if(readOnly)throw new Error(remoteMissing?t('Create the data file on GitHub first (Settings).'):t('Offline / not synced — changes are blocked until GitHub is reachable. Press Refresh.'));
    setSync('busy',t('Saving…'));
    for(let attempt=0;attempt<4;attempt++){
      const draft=clone(db);const res=fn(draft);
      draft.log.unshift({t:nowIso(),by:userName(),a:label});draft.log=draft.log.slice(0,400);
      validateAll(draft);
      if(!ghMode()){db=draft;sync.at=nowIso();cache();setSync('local');render();return res}
      try{await ghSave(draft,`${label} — ${userName()}`);db=draft;sync.at=nowIso();cache();setSync('ok');render();return res}
      catch(e){if(!e.stale)throw e;const r=await ghLoad();if(r.missing)throw new Error(t('data.json not found'));db=r.data;sha=r.sha}
    }
    throw new Error(t('Could not save after several attempts — others are saving at the same time. Try again.'))
  });
  chain=p.catch(e=>{setSync(!ghMode()?'local':(readOnly||e.net)?'err':'ok',e instanceof ConflictError?'':e.message)});
  return p}
/* record-level edit protection */
function touch(x){x.updatedAt=nowIso();x.updatedBy=userName();return x}
function upsert(arr,obj,base,force){const i=arr.findIndex(x=>x.id===obj.id);
  if(i>=0){const cur=arr[i];if(!force&&base!==null&&base!==undefined&&(cur.updatedAt||'')!==base)throw new ConflictError(cur);arr[i]=touch({...cur,...obj});return arr[i]}
  if(base)throw new Error(t('This record was deleted by another user.'));const n=touch({...obj});arr.push(n);return n}

async function submitForm(e){e.preventDefault();if(!editing)return;const {kind,id,base,ctx}=editing,F=$('form'),fd=new FormData(F),v=k=>String(fd.get(k)??'').trim(),err=$('error');
  try{
    for(const el of F.querySelectorAll('[required]'))if(!el.disabled&&!String(el.value).trim())throw new Error(t('Please complete all required fields (*).'));
    for(const el of F.querySelectorAll('input[type=email]'))if(el.value&&!el.checkValidity())throw new Error(t('Enter a valid email address.'));
    let o,label,after;
    if(kind==='rfq'){o={id:id||uid(),no:v('no'),date:v('date'),dueDate:v('dueDate'),clientId:v('clientId'),siteId:v('siteId'),contactId:v('contactId'),project:v('project'),location:v('location'),owner:v('owner'),subject:v('subject'),types:fd.getAll('types'),manager:v('manager'),prepared:v('prepared'),supplierIds:fd.getAll('supplierIds'),status:v('status'),reason:v('reason'),notes:v('notes')};
      if(!o.types.length)throw new Error(t('Select at least one work type.'));label=`RFQ ${o.no} ${id?'updated':'created'} (${o.status})`;
      if(id){const old=byId(db.rfqs,id);if(old&&old.status!==o.status)label=`RFQ ${o.no} status ${old.status} → ${o.status}`}}
    else if(kind==='quote'){const q=ctx.rec;
      if(editing.locked){o={id,folderPath:v('folderPath'),notes:v('notes')};label=`Quotation ${q.quoteNo} Rev ${q.rev} notes/folder updated`}
      else{o={id:id||uid(),rfqId:id||ctx.reviseOf?q.rfqId:v('rfqId'),quoteNo:v('quoteNo'),rev:Number(q.rev)||0,date:v('date'),validUntil:v('validUntil'),prepared:v('prepared'),status:v('status'),net:r2(v('net')),cost:r2(v('cost')),folderPath:v('folderPath'),notes:v('notes'),snapshot:null};
        if(!o.rfqId)throw new Error(t('Select the linked RFQ.'));label=`Quotation ${o.quoteNo} Rev ${o.rev} ${id?'updated':'created'}${o.status==='Submitted'?' and submitted':''} — RFQ ${byId(db.rfqs,o.rfqId)?.no} — net ${money(o.net)}`}}
    else if(kind==='supplier'){o={id:id||uid(),name:v('name'),vatNo:v('vatNo'),contact:v('contact'),phone:v('phone'),email:v('email'),active:v('active')!=='0',types:fd.getAll('types'),notes:v('notes')};if(!o.types.length)throw new Error(t('Select at least one work type.'));label=`Supplier ${o.name} saved`}
    else if(kind==='person'){o={id:id||uid(),name:v('name'),email:v('email'),phone:v('phone'),active:v('active')!=='0',roles:fd.getAll('roles')};if(!o.roles.length)throw new Error(t('Select at least one responsibility.'));label=`Team member ${o.name} saved`}
    else if(kind==='client'){const sites=currentSites();const contacts=[...$('contactslist').querySelectorAll('[data-contact-row]')].map(el=>{const g=n=>el.querySelector('[name='+n+']').value.trim();return {id:el.dataset.rowId,name:g('contactName'),title:g('contactTitle'),phone:g('contactPhone'),email:g('contactEmail'),siteId:g('contactSite')}});
      o={id:id||uid(),name:v('name'),vatNo:v('vatNo'),crNo:v('crNo'),phone:v('phone'),email:v('email'),active:v('active')!=='0',notes:v('notes'),sites,contacts};label=`Client ${o.name} saved`}
    else if(kind==='supq'){o={id:id||uid(),rfqId:ctx.rfqId,supplierId:v('supplierId'),ref:v('ref'),date:v('date'),amount:r2(v('amount')),notes:v('notes')};label=`Supplier quote from ${byId(db.suppliers,o.supplierId)?.name} — RFQ ${byId(db.rfqs,o.rfqId)?.no} — ${money(o.amount)}`}
    else if(kind==='fu'){o={id:id||uid(),rfqId:ctx.rfqId,date:v('date'),done:v('done')==='1',note:v('note'),nextDate:v('nextDate'),nextAction:v('nextAction')};label=`Follow-up on RFQ ${byId(db.rfqs,o.rfqId)?.no}: ${o.note.slice(0,60)}`}
    const run=force=>commit(label,d=>{
      const rec=upsert(d[KEYS[kind]],o,base,force);
      if(kind==='rfq'){if(!byId(d.rfqs,rec.id))return;syncRfq(d,rec.id)}
      if(kind==='quote'){const r=byId(d.rfqs,rec.rfqId);if(r?.status==='Cancelled'&&!editing?.locked)throw new Error(t('This RFQ is cancelled. Change its status before adding quotations.'));
        if(rec.status==='Submitted'&&!rec.snapshot)rec.snapshot=makeSnapshot(d,rec);
        if(r&&!OUTCOMES.includes(r.status)&&r.status==='New RQ')r.status='In progress';syncRfq(d,rec.rfqId)}
      return rec});
    $('savebtn').disabled=true;
    try{await run(false)}catch(ex){if(ex instanceof ConflictError){if(confirm(t('{u} changed this record at {t} while you were editing. Overwrite their changes with yours?',{u:ex.rec.updatedBy||'?',t:fmtTime(ex.rec.updatedAt)})))await run(true);else{$('modal').close();editing=null;toast(t('Your edit was cancelled; the latest version is shown.'));return}}else throw ex}
    $('modal').close();editing=null;toast(t('Saved.'));
  }catch(ex){err.textContent=ex.message;err.style.display='block';err.scrollIntoView({block:'nearest'})}
  finally{$('savebtn').disabled=false}}

/* ================= Delete / deactivate ================= */
async function removeRec(kind,id){const d=db;let why='';
  if(kind==='client'&&d.rfqs.some(r=>r.clientId===id))why=t('This client is used by RFQs. Set it to Inactive instead.');
  if(kind==='supplier'&&(d.rfqs.some(r=>r.supplierIds.includes(id))||d.supplierQuotes.some(s=>s.supplierId===id)))why=t('This supplier is used by RFQs or supplier quotes. Set it to Inactive instead.');
  if(kind==='person'&&(d.rfqs.some(r=>r.manager===id||r.prepared===id)||d.quotes.some(q=>q.prepared===id)))why=t('This person is assigned to records. Set them to Inactive instead.');
  if(kind==='rfq'&&(quotesOf(d,id).length))why=t('Delete linked quotations before deleting this RFQ.');
  if(kind==='quote'&&byId(d.quotes,id)?.status==='Submitted')why=t('Submitted quotations cannot be deleted — they are the record of what was sent.');
  if(why){toast(why);return}
  const rec=byId(d[KEYS[kind]],id);const nm=rec?.no||rec?.quoteNo&&rec.quoteNo+' Rev '+rec.rev||rec?.name||rec?.note||'';
  if(!confirm(t('Delete this record permanently?')+'\n'+nm))return;
  try{await commit(`Deleted ${({rfq:'RFQ',quote:'quotation',supplier:'supplier',person:'team member',client:'client',supq:'supplier quote',fu:'follow-up'})[kind]} ${nm}${kind==='supq'||kind==='fu'?' — RFQ '+(byId(d.rfqs,rec.rfqId)?.no||''):''}`,dd=>{const arr=dd[KEYS[kind]];const i=arr.findIndex(x=>x.id===id);if(i<0)return;const was=arr[i];arr.splice(i,1);
      if(kind==='rfq'){dd.followups=dd.followups.filter(x=>x.rfqId!==id);dd.supplierQuotes=dd.supplierQuotes.filter(x=>x.rfqId!==id)}
      if(kind==='quote')syncRfq(dd,was.rfqId)});toast(t('Deleted.'))}catch(e){toast(e.message)}}

});

  if(e.target.id==='form')return submitForm(e);
  if(e.target.id==='ghform'){e.preventDefault();const fd=new FormData(e.target),g=k=>String(fd.get(k)||'').trim();
    const wasRepo=cfg.owner+'/'+cfg.repo;cfg={user:g('user'),owner:g('owner'),repo:g('repo'),branch:g('branch')||'main',path:g('path')||'data.json',token:g('token')};
    if(!cfg.user){toast(t('Enter your name.'));return}
    if((cfg.owner||cfg.repo||cfg.token)&&!ghMode()){toast(t('Enter owner, repository and token to connect — or leave all three empty for local mode.'));return}
    lsSet(CFG_KEY,JSON.stringify(cfg));if(wasRepo!==cfg.owner+'/'+cfg.repo)sha=null;
    if(ghMode()){/* keep local records available so they can seed a new data.json */const local=db;await loadData();if(remoteMissing&&(local.rfqs.length||local.clients.length)){db=local;render()}toast(remoteMissing?t('Connected. data.json does not exist yet — press “Create data.json on GitHub”.'):readOnly?t('Connection failed: {m}',{m:sync.msg}):t('Connected to GitHub.'))}
    else{loadData();toast(t('Saved. Working in local mode.'))}}
  if(e.target.id==='numform'){e.preventDefault();const fd=new FormData(e.target);const y=String(fd.get('quoteYear')).trim(),s=Math.max(1,Math.floor(Number(fd.get('quoteStart'))||1));if(!/^\d{4}$/.test(y)){toast(t('Enter a 4-digit year.'));return}
    try{await commit(`Quotation numbering set to start at ${s}/${y}`,d=>{d.settings.quoteYear=y;d.settings.quoteStart=s});toast(t('Saved.'))}catch(er){toast(er.message)}}
});
document.addEventListener('input',e=>{const el=e.target;
  if(el.id==='search'){f.search=el.value;const pos=el.selectionStart;render();const s=$('search');if(s){s.focus();s.setSelectionRange(pos,pos)}}
  if(editing?.kind==='quote'&&$('modal').open&&['net','cost'].includes(el.name))quoteDeps();
  if(editing?.kind==='client'&&el.name==='siteName')refreshContactSites();
  if(editing?.kind==='rfq'&&el.name==='location')el.dataset.auto='0';
});
document.addEventListener('change',e=>{const el=e.target;
  if(el.id==='fstatus'){f.status=el.value;render()}if(el.id==='ftype'){f.type=el.value;render()}if(el.id==='fpm'){f.pm=el.value;render()}
  if(editing?.kind==='rfq'&&['clientId','siteId'].includes(el.name))rfqDeps(false);
  if(editing?.kind==='quote'&&el.name==='rfqId'){const F=$('form').elements;const r=byId(db.rfqs,el.value);if(r&&!F.prepared.value)F.prepared.value=r.prepared||'';if(r&&!Number(F.cost.value))F.cost.value=supplierCost(db,r.id);quoteDeps()}
  if(el.id==='restorefile'&&el.files[0]){restoreFile(el.files[0]);el.value=''}
});
$('close').onclick=$('cancel').onclick=()=>{$('modal').close();editing=null};
$('modal').addEventListener('close',()=>{editing=null});
$('viewclose').onclick=()=>{$('view').close();viewing=null};
$('langbtn').onclick=()=>{lang=lang==='ar'?'en':'ar';lsSet(LANG_KEY,lang);render();if(sync.state)setSync(sync.state,sync.msg)};
$('refresh').onclick=()=>loadData(false);
/* poll GitHub every 60 s for teammates' changes (only when idle) */
setInterval(()=>{if(ghMode()&&document.visibilityState==='visible'&&!$('modal').open&&!remoteMissing&&sync.state!=='busy')loadData(true)},60000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&ghMode()&&!$('modal').open&&!remoteMissing)loadData(true)});
window.addEventListener('beforeunload',e=>{if(sync.state==='busy'){e.preventDefault();e.returnValue=''}});
if(!cfg.user)page='settings';
loadData();
</script></body></html>
